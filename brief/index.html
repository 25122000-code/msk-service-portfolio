<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brief Vidéo MSK</title>
<style>
  :root{
    --bg:#0d0d0c;
    --panel:#161410;
    --panel-2:#1d1a14;
    --text:#f3efe4;
    --muted:#a89f8c;
    --accent:#d4a747;
    --accent-soft:rgba(212,167,71,.14);
    --border:#2b2620;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    padding:0 16px;
    padding-block:48px 80px;
  }
  h1,h2{font-family:'Fraunces',Georgia,serif;}
  .wrap{max-width:640px;margin:0 auto;}
  .langbar{display:flex;justify-content:center;gap:6px;margin-bottom:22px;}
  .langbar button{
    background:var(--panel-2);border:1px solid var(--border);color:var(--muted);
    border-radius:20px;padding:6px 14px;font-size:.78rem;font-weight:600;
    cursor:pointer;font-family:inherit;letter-spacing:.03em;
  }
  .langbar button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  header{text-align:center;margin-bottom:40px;}
  header .eyebrow{
    color:var(--accent);letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;font-weight:600;margin-bottom:10px;
  }
  header h1{font-size:2rem;margin:0 0 10px;text-wrap:balance;}
  header p{color:var(--muted);font-size:.95rem;line-height:1.5;margin:0;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px 22px;
    margin-bottom:18px;
  }
  .card .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);
    font-size:.75rem;font-weight:700;margin-right:10px;
  }
  .card h2{font-size:1.05rem;margin:0 0 4px;display:flex;align-items:center;}
  .card .hint{color:var(--muted);font-size:.82rem;margin:0 0 16px 36px;line-height:1.4;}
  label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=email],input[type=tel],textarea,select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    border-radius:8px;color:var(--text);padding:10px 12px;font-size:.92rem;
    font-family:inherit;
  }
  textarea{min-height:70px;resize:vertical;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .choices label{
    margin:0;display:flex;align-items:center;gap:6px;
    background:var(--panel-2);border:1px solid var(--border);
    border-radius:20px;padding:7px 13px;font-size:.85rem;color:var(--text);
    cursor:pointer;width:auto;
  }
  .choices input{width:auto;accent-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.row2{grid-template-columns:1fr;}}
  .submit-bar{position:sticky;bottom:0;padding-top:14px;}
  button.submit{
    width:100%;background:var(--accent);color:#1a1608;border:none;
    border-radius:10px;padding:15px;font-size:1rem;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  button.submit:disabled{opacity:.6;cursor:default;}
  .note{color:var(--muted);font-size:.78rem;text-align:center;margin-top:10px;line-height:1.5;}
  .err{color:#e08a8a;font-size:.8rem;margin-top:6px;display:none;}
  [hidden]{display:none!important;}
  .done{text-align:center;padding:60px 20px;}
  .done .mark{
    width:52px;height:52px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;font-size:1.4rem;
  }
  .done h1{font-size:1.5rem;margin:0 0 10px;}
  .done p{color:var(--muted);line-height:1.6;max-width:420px;margin:0 auto;}
</style>
</head>
<body>
<div class="wrap">

  <div class="langbar" id="langbar">
    <button type="button" data-lang="fr">FR</button>
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="es">ES</button>
  </div>

  <header>
    <div class="eyebrow">MSK Service</div>
    <h1 data-i18n="title"></h1>
    <p data-i18n="subtitle"></p>
  </header>

  <form id="form">

    <div class="card">
      <h2><span class="num">1</span><span data-i18n="s1_h"></span></h2>
      <p class="hint" data-i18n="s1_hint"></p>
      <label data-i18n="l_company"></label>
      <input type="text" name="company" id="company" required>
      <div class="row2">
        <div>
          <label data-i18n="l_industry"></label>
          <input type="text" name="industry" id="industry" data-i18n-ph="ph_industry">
        </div>
        <div>
          <label data-i18n="l_location"></label>
          <input type="text" name="location" id="location">
        </div>
      </div>
      <label data-i18n="l_website"></label>
      <input type="text" name="website" id="website" placeholder="https://">
      <label data-i18n="l_socials"></label>
      <input type="text" name="socials" id="socials" data-i18n-ph="ph_socials">
    </div>

    <div class="card">
      <h2><span class="num">2</span><span data-i18n="s2_h"></span></h2>
      <p class="hint" data-i18n="s2_hint"></p>
      <label data-i18n="l_product"></label>
      <textarea name="product" id="product" required></textarea>
      <label data-i18n="l_difference"></label>
      <textarea name="difference" id="difference"></textarea>
      <label data-i18n="l_pricerange"></label>
      <select name="priceRange" id="pricerange">
        <option value="" data-i18n="opt_select"></option>
        <option value="affordable" data-i18n="price_1"></option>
        <option value="mid-range" data-i18n="price_2"></option>
        <option value="premium" data-i18n="price_3"></option>
        <option value="luxury" data-i18n="price_4"></option>
      </select>
    </div>

    <div class="card">
      <h2><span class="num">3</span><span data-i18n="s3_h"></span></h2>
      <p class="hint" data-i18n="s3_hint"></p>
      <label data-i18n="l_audience"></label>
      <textarea name="audience" id="audience"></textarea>
    </div>

    <div class="card">
      <h2><span class="num">4</span><span data-i18n="s4_h"></span></h2>
      <div class="choices" id="goals">
        <label><input type="checkbox" name="goals" value="Brand awareness"><span data-i18n="goal_1"></span></label>
        <label><input type="checkbox" name="goals" value="Direct sales / conversion"><span data-i18n="goal_2"></span></label>
        <label><input type="checkbox" name="goals" value="Social media (Reels, TikTok, Shorts)"><span data-i18n="goal_3"></span></label>
        <label><input type="checkbox" name="goals" value="Website / product page"><span data-i18n="goal_4"></span></label>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">5</span><span data-i18n="s5_h"></span></h2>
      <div class="choices" id="moods">
        <label><input type="checkbox" name="moods" value="Luxury / minimal"><span data-i18n="mood_1"></span></label>
        <label><input type="checkbox" name="moods" value="Warm / family"><span data-i18n="mood_2"></span></label>
        <label><input type="checkbox" name="moods" value="Dynamic / young"><span data-i18n="mood_3"></span></label>
        <label><input type="checkbox" name="moods" value="Minimalist"><span data-i18n="mood_4"></span></label>
      </div>
      <label data-i18n="l_inspirations"></label>
      <textarea name="inspirations" id="inspirations"></textarea>
    </div>

    <div class="card">
      <h2><span class="num">6</span><span data-i18n="s6_h"></span></h2>
      <div class="row2">
        <div>
          <label data-i18n="l_format"></label>
          <select name="format" id="format">
            <option value="" data-i18n="opt_select"></option>
            <option value="16:9" data-i18n="format_1"></option>
            <option value="9:16" data-i18n="format_2"></option>
            <option value="both" data-i18n="format_3"></option>
          </select>
        </div>
        <div>
          <label data-i18n="l_duration"></label>
          <select name="duration" id="duration">
            <option value="" data-i18n="opt_select"></option>
            <option value="10s" data-i18n="dur_1"></option>
            <option value="15s" data-i18n="dur_2"></option>
            <option value="30s" data-i18n="dur_3"></option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">7</span><span data-i18n="s7_h"></span></h2>
      <p class="hint" data-i18n="s7_hint"></p>
      <label data-i18n="l_photolink"></label>
      <input type="text" name="photoLink" id="photolink" placeholder="https://">
      <div class="note" style="margin-top:8px;text-align:left;" data-i18n="note_photo"></div>
      <label data-i18n="l_brandkit"></label>
      <select name="brandKit" id="brandkit">
        <option value="" data-i18n="opt_select"></option>
        <option value="yes" data-i18n="yn_yes"></option>
        <option value="no" data-i18n="yn_no"></option>
        <option value="partial" data-i18n="brandkit_partial"></option>
      </select>
    </div>

    <div class="card">
      <h2><span class="num">8</span><span data-i18n="s8_h"></span></h2>
      <label data-i18n="l_human"></label>
      <select name="human" id="human">
        <option value="" data-i18n="opt_select"></option>
        <option value="yes" data-i18n="yn_yes"></option>
        <option value="no" data-i18n="yn_no"></option>
        <option value="unsure" data-i18n="human_unsure"></option>
      </select>
      <label data-i18n="l_humandetails"></label>
      <input type="text" name="humanDetails" id="humandetails">
    </div>

    <div class="card">
      <h2><span class="num">9</span><span data-i18n="s9_h"></span></h2>
      <div class="row2">
        <div>
          <label data-i18n="l_music"></label>
          <select name="music" id="music">
            <option value="" data-i18n="opt_select"></option>
            <option value="emotional" data-i18n="music_1"></option>
            <option value="upbeat" data-i18n="music_2"></option>
            <option value="neutral" data-i18n="music_3"></option>
          </select>
        </div>
        <div>
          <label data-i18n="l_voiceover"></label>
          <select name="voiceover" id="voiceover">
            <option value="" data-i18n="opt_select"></option>
            <option value="yes" data-i18n="yn_yes"></option>
            <option value="no" data-i18n="yn_no"></option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">10</span><span data-i18n="s10_h"></span></h2>
      <label data-i18n="l_constraints"></label>
      <textarea name="constraints" id="constraints"></textarea>
    </div>

    <div class="card">
      <h2><span class="num">11</span><span data-i18n="s11_h"></span></h2>
      <div class="row2">
        <div>
          <label data-i18n="l_deadline"></label>
          <input type="text" name="deadline" id="deadline" data-i18n-ph="ph_deadline">
        </div>
        <div>
          <label data-i18n="l_budget"></label>
          <input type="text" name="budget" id="budget">
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="num">12</span><span data-i18n="s12_h"></span></h2>
      <label data-i18n="l_email"></label>
      <input type="email" name="email" id="email" required>
      <label data-i18n="l_phone"></label>
      <input type="tel" name="phone" id="phone">
      <label data-i18n="l_availability"></label>
      <input type="text" name="availability" id="availability">
    </div>

    <div class="submit-bar">
      <button type="submit" class="submit" id="submitBtn" data-i18n="btn_submit"></button>
      <div class="err" id="err" data-i18n="err_required"></div>
      <div class="note" data-i18n="note_bottom"></div>
    </div>

  </form>

  <div class="done" id="done" hidden>
    <div class="mark">✓</div>
    <h1 data-i18n="done_h"></h1>
    <p data-i18n="done_p"></p>
  </div>

</div>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">

  var currentLang = 'fr';

  function applyLanguage(lang){
    if(!DICT[lang]) lang = 'fr';
    currentLang = lang;
    var dict = DICT[lang];
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){
      var key = el.getAttribute('data-i18n-ph');
      if(dict[key] !== undefined) el.setAttribute('placeholder', dict[key]);
    });
    document.querySelectorAll('#langbar button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
  }

  document.querySelectorAll('#langbar button').forEach(function(b){
    b.addEventListener('click', function(){ applyLanguage(b.getAttribute('data-lang')); });
  });

  var initial = 'fr';
  try{
    var nav = (navigator.language || 'fr').slice(0,2).toLowerCase();
    if(nav === 'en' || nav === 'es') initial = nav;
  }catch(ex){}
  applyLanguage(initial);

  function checkedValues(containerId){
    var els = document.querySelectorAll('#'+containerId+' input[type=checkbox]:checked');
    return Array.prototype.map.call(els, function(e){return e.value;}).join(', ');
  }

  async function submit(e){
    e.preventDefault();
    var company = document.getElementById('company').value.trim();
    var product = document.getElementById('product').value.trim();
    var email = document.getElementById('email').value.trim();
    var err = document.getElementById('err');
    if(!company || !product || !email){
      err.style.display = 'block';
      return;
    }
    err.style.display = 'none';

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;

    var data = {
      _subject: 'Nouveau brief client — ' + company,
      _template: 'table',
      _captcha: 'false',
      formLanguage: currentLang,
      company: company,
      industry: document.getElementById('industry').value.trim(),
      location: document.getElementById('location').value.trim(),
      website: document.getElementById('website').value.trim(),
      socials: document.getElementById('socials').value.trim(),
      product: product,
      difference: document.getElementById('difference').value.trim(),
      priceRange: document.getElementById('pricerange').value,
      audience: document.getElementById('audience').value.trim(),
      goals: checkedValues('goals'),
      moods: checkedValues('moods'),
      inspirations: document.getElementById('inspirations').value.trim(),
      format: document.getElementById('format').value,
      duration: document.getElementById('duration').value,
      photoLink: document.getElementById('photolink').value.trim(),
      brandKit: document.getElementById('brandkit').value,
      human: document.getElementById('human').value,
      humanDetails: document.getElementById('humandetails').value.trim(),
      music: document.getElementById('music').value,
      voiceover: document.getElementById('voiceover').value,
      constraints: document.getElementById('constraints').value.trim(),
      deadline: document.getElementById('deadline').value.trim(),
      budget: document.getElementById('budget').value.trim(),
      email: email,
      phone: document.getElementById('phone').value.trim(),
      availability: document.getElementById('availability').value.trim()
    };

    try{
      await fetch('https://formsubmit.co/ajax/857e0f49471b5a83367fad1c6dbbedfb', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      });
    }catch(ex){
      // best-effort; still show confirmation so the client isn't blocked
    }

    document.getElementById('form').hidden = true;
    document.getElementById('done').hidden = false;
  }

  document.getElementById('form').addEventListener('submit', submit);
})();
</script>
</body>
</html>
