<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSK Service — Demo videos</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #f5f5f5; margin: 0; padding: 0; }
  header { padding: 40px 20px 20px; text-align: center; }
  header h1 { font-size: 1.8rem; margin-bottom: 4px; }
  header p { color: #aaa; }
  main { max-width: 1400px; margin: 0 auto; padding: 0 20px 60px; }
  section { margin-bottom: 50px; scroll-margin-top: 20px; }
  section h2 { font-size: 1.3rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 16px; }
  video { width: 100%; border-radius: 10px; background: #000; display: block; }
  footer { text-align: center; color: #666; padding: 30px; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>MSK Service</h1>
  <p>Advertising videos — sample work</p>
</header>

<main>

<section id="luxe">
  <h2>Jewelry &amp; Leather Goods</h2>
  <div class="grid">
    <video controls playsinline preload="metadata">
      <source src="eclat-luxe.mp4" type="video/mp4">
    </video>
  </div>
</section>

<section id="maison">
  <h2>Home &amp; Décor</h2>
  <div class="grid">
    <video controls playsinline preload="metadata">
      <source src="foyer-maison.mp4" type="video/mp4">
    </video>
  </div>
</section>

<section id="gourmandise">
  <h2>Food &amp; Artisan Craft</h2>
  <div class="grid">
    <video controls playsinline preload="metadata">
      <source src="recolte-gourmandise.mp4" type="video/mp4">
    </video>
    <video controls playsinline preload="metadata">
      <source src="recolte-cafe-chocolat.mp4" type="video/mp4">
    </video>
  </div>
</section>

<section id="bienetre">
  <h2>Natural Wellness &amp; Skincare</h2>
  <div class="grid">
    <video controls playsinline preload="metadata">
      <source src="eclore-bienetre.mp4" type="video/mp4">
    </video>
  </div>
</section>

<section id="enfance">
  <h2>Children &amp; Wooden Toys</h2>
  <div class="grid">
    <video controls playsinline preload="metadata">
      <source src="petitspas-enfance.mp4" type="video/mp4">
    </video>
  </div>
</section>

<section id="services">
  <h2>Services &amp; Technology</h2>
  <div class="grid">
    <video controls playsinline preload="metadata">
      <source src="all-services.mp4" type="video/mp4">
    </video>
  </div>
</section>

</main>

<footer>MSK Service — sample video content</footer>
<script data-goatcounter="https://mskservice.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
