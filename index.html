<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSK Service — Vidéos de démonstration</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #f5f5f5; margin: 0; padding: 0; }
  header { padding: 40px 20px 20px; text-align: center; }
  header h1 { font-size: 1.8rem; margin-bottom: 4px; }
  header p { color: #aaa; }
  section { max-width: 720px; margin: 0 auto 60px; padding: 0 20px; scroll-margin-top: 20px; }
  section h2 { font-size: 1.3rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
  video { width: 100%; border-radius: 10px; margin-top: 16px; background: #000; }
  footer { text-align: center; color: #666; padding: 30px; font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <h1>MSK Service</h1>
  <p>Vidéos publicitaires générées par IA — exemples de réalisation</p>
</header>

<section id="luxe">
  <h2>Bijouterie &amp; Maroquinerie</h2>
  <video controls playsinline preload="metadata">
    <source src="eclat-luxe.mp4" type="video/mp4">
  </video>
</section>

<section id="maison">
  <h2>Déco &amp; Maison</h2>
  <video controls playsinline preload="metadata">
    <source src="foyer-maison.mp4" type="video/mp4">
  </video>
</section>

<section id="gourmandise">
  <h2>Gastronomie &amp; Artisanat gourmand</h2>
  <video controls playsinline preload="metadata">
    <source src="recolte-gourmandise.mp4" type="video/mp4">
  </video>
</section>

<footer>MSK Service — contenu vidéo réalisé pour démonstration</footer>
</body>
</html>
